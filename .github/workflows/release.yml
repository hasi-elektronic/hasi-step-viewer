name: release
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node tools/make-testblech.mjs public/testblech.step
      - run: node tools/test-brep.mjs public/testblech.step
      - run: node tools/test-einheit.mjs public/testblech.step
      - run: node tools/test-messen.mjs
      - run: node tools/test-baum.mjs
      - run: npm run build
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis,msi'
            out: 'src-tauri/target/release/bundle/**/*.*'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg,app'
            out: 'src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: hasi-step-viewer-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error
